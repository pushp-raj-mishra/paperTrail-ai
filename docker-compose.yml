version: "3.8"

services:
  ## pgsql with pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: papertrail_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: papertrail_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d papertrail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ## redis for bullmq
  redis:
    image: redis:7-alpine
    container_name: papertrail_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: # this is my persistent volume for PostgreSQL database
  redisdata: # this is my persistent volume for Redis queue data
